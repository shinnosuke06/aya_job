<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="apple-touch-icon" href="aya_job.jpg">
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>勤怠・給料管理アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        input, select, textarea, button { font-size: 16px !important; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .tab-active { color: #db2777; border-bottom: 3px solid #db2777; font-weight: bold; }
        .tab-inactive { color: #9ca3af; }
        body { background-color: #fdf2f8; -webkit-font-smoothing: antialiased; }
        .paid-item { opacity: 0.6; }
    </style>
</head>
<body class="text-gray-800 pb-20 select-none">

    <header class="bg-pink-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-piggy-bank mr-2"></i>給与＆家計管理</h1>
        <div class="flex items-center bg-pink-600 rounded-full px-3 py-1">
            <button onclick="changeMonth(-1)" class="px-2 text-white hover:opacity-80 active:scale-95 transition" aria-label="先月"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="headerMonth" class="px-2 font-bold min-w-[80px] text-center"></span>
            <button onclick="changeMonth(1)" class="px-2 text-white hover:opacity-80 active:scale-95 transition" aria-label="来月"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </header>

    <main id="app-content" class="p-4 max-w-lg mx-auto relative min-h-[80vh]"></main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-pink-200 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10">
        <div class="flex justify-around max-w-lg mx-auto">
            <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-3 text-center tab-active flex flex-col items-center transition">
                <i class="fa-solid fa-chart-pie mb-1 text-lg"></i><span class="text-xs">ホーム</span>
            </button>
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-3 text-center tab-inactive flex flex-col items-center transition">
                <i class="fa-regular fa-calendar-alt mb-1 text-lg"></i><span class="text-xs">カレンダー</span>
            </button>
            <button onclick="switchTab('expenses')" id="tab-expenses" class="flex-1 py-3 text-center tab-inactive flex flex-col items-center transition">
                <i class="fa-solid fa-wallet mb-1 text-lg"></i><span class="text-xs">支払い</span>
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-3 text-center tab-inactive flex flex-col items-center transition">
                <i class="fa-solid fa-cog mb-1 text-lg"></i><span class="text-xs">設定</span>
            </button>
        </div>
    </nav>

    <div id="workModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="modalDateTitle" class="text-xl font-bold text-pink-600">日付</h2>
                <button onclick="closeModal('workModal')" class="text-gray-500 text-2xl hover:text-gray-700">&times;</button>
            </div>
            <input type="hidden" id="modalDate">
            
            <!-- 両方の仕事が非表示の場合の案内 -->
            <div id="modalBothJobsHiddenNotice" class="hidden mb-4 bg-gray-50 p-3 rounded-xl border border-gray-200 text-center text-xs text-gray-500">
                <i class="fa-solid fa-eye-slash mr-1 text-gray-400"></i> 仕事1・仕事2はともに非表示に設定されています。<br>
                <span class="text-[11px] text-pink-500">（「設定」タブから表示設定を変更できます）</span>
            </div>

            <!-- 仕事1入力部 -->
            <div id="modalJob1Wrapper" class="mb-4 bg-pink-50 p-4 rounded-xl border border-pink-100">
                <h3 class="font-bold text-pink-700 mb-2 border-b border-pink-200 pb-1" id="lbl-job1-name">仕事1</h3>
                <div id="modalJob1Content">
                    <div class="mb-3">
                        <label class="block text-sm text-gray-700 mb-1">出勤状況</label>
                        <div class="flex space-x-2">
                            <button type="button" id="btn-status-none" onclick="setJob1Status('')" class="flex-1 py-2 rounded border border-gray-300 bg-white text-gray-500 text-sm">未設定</button>
                            <button type="button" id="btn-status-work" onclick="setJob1Status('work')" class="flex-1 py-2 rounded border border-pink-300 bg-white text-pink-600 text-sm">出勤</button>
                            <button type="button" id="btn-status-absent" onclick="setJob1Status('absent')" class="flex-1 py-2 rounded border border-red-300 bg-white text-red-600 text-sm">欠勤</button>
                        </div>
                        <input type="hidden" id="modalJob1Status">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">残業時間 (時間)</label>
                        <input type="number" id="modalJob1Overtime" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-pink-500" step="0.5" min="0">
                    </div>
                </div>
            </div>

            <!-- 仕事2入力部 -->
            <div id="modalJob2Wrapper" class="mb-4 bg-orange-50 p-4 rounded-xl border border-orange-100">
                <div class="flex justify-between items-center mb-2 border-b border-orange-200 pb-1">
                    <h3 class="font-bold text-orange-700" id="lbl-job2-name">仕事2</h3>
                    <button type="button" onclick="addJob2ShiftRow()" class="text-xs bg-orange-500 hover:bg-orange-600 text-white px-2 py-1 rounded shadow font-bold">
                        <i class="fa-solid fa-plus mr-1"></i>シフト追加
                    </button>
                </div>
                <div id="modalJob2Content">
                    <p id="job2StepNotice" class="text-[11px] text-gray-500 mb-2">※時間は15分刻みです。17:00〜1:00など日をまたぐ場合は翌日として自動計算します。</p>
                    <div id="job2ShiftsList" class="space-y-2 mb-3">
                        <!-- JSで動的にシフト入力行を挿入 -->
                    </div>
                    <div id="job2CalcSummary" class="text-xs text-orange-800 bg-orange-100/60 p-2 rounded border border-orange-200 hidden">
                        <!-- リアルタイム計算結果表示 -->
                    </div>
                </div>
            </div>

            <!-- 臨時収入セクション -->
            <div class="mb-6 bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                <button type="button" onclick="document.getElementById('extraIncomeFields').classList.toggle('hidden')" class="w-full flex justify-between items-center font-bold text-yellow-700">
                    <span><i class="fa-solid fa-sack-dollar mr-1"></i> 臨時収入を入力</span>
                    <i class="fa-solid fa-chevron-down text-sm"></i>
                </button>
                <div id="extraIncomeFields" class="hidden space-y-2 mt-3 border-t border-yellow-200 pt-3">
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">金額 (円)</label>
                        <input type="number" id="modalExtraAmount" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-yellow-500" min="0" placeholder="例: 10000">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">メモ</label>
                        <input type="text" id="modalExtraMemo" class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:border-yellow-500" placeholder="例: お祝い金">
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="closeModal('workModal')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold">キャンセル</button>
                <button onclick="requestSaveWorkData()" class="px-4 py-2 bg-pink-500 text-white font-bold rounded-lg shadow hover:bg-pink-600">保存する</button>
            </div>
        </div>
    </div>

    <div id="expenseItemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-700" id="ei-title">支払い項目の設定</h2>
                <button onclick="closeModal('expenseItemModal')" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <input type="hidden" id="ei-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">種類</label>
                    <select id="ei-type" onchange="onExpenseTypeChange()" class="w-full border border-gray-300 rounded p-2 bg-white">
                        <option value="fixed">固定費 (家賃, 保険など)</option>
                        <option value="variable">変動費 (食費, 雑費など)</option>
                        <option value="card">カード</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">項目名</label>
                    <input type="text" id="ei-name" placeholder="例: 家賃" class="w-full border border-gray-300 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">基本の金額 (円)</label>
                    <input type="number" id="ei-default-amount" placeholder="例: 10000" class="w-full border border-gray-300 rounded p-2">
                    <p class="text-[10px] text-gray-500 mt-1">※固定費など毎月同じ金額の場合は入力しておくと便利です</p>
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">引き落とし口座</label>
                    <select id="ei-account" class="w-full border border-gray-300 rounded p-2 bg-white">
                        <!-- JSで動的に追加 -->
                    </select>
                </div>
            </div>
            <div class="flex justify-between mt-6">
                <button id="ei-delete-btn" onclick="deleteExpenseItem()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hidden">削除</button>
                <div class="flex space-x-3 ml-auto">
                    <button onclick="closeModal('expenseItemModal')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold">キャンセル</button>
                    <button onclick="saveExpenseItem()" class="px-4 py-2 bg-pink-500 text-white font-bold rounded-lg shadow hover:bg-pink-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="expenseRecordModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-lg font-bold text-gray-700 mb-2" id="er-name"></h2>
            <p class="text-sm text-gray-500 mb-4" id="er-month"></p>
            <input type="hidden" id="er-id">
            <input type="hidden" id="er-target-month">
            <div class="mb-4">
                <input type="number" id="er-amount" placeholder="金額 (円)" class="w-full border border-gray-300 rounded p-3 text-center text-xl font-bold">
            </div>
            <label class="flex items-center justify-center space-x-2 mb-6 cursor-pointer bg-gray-50 py-3 rounded-lg border border-gray-200">
                <input type="checkbox" id="er-ispaid" class="w-6 h-6 text-pink-500 rounded border-gray-300 focus:ring-pink-500">
                <span class="font-bold text-gray-700 text-lg">支払いを「済」にする</span>
            </label>
            <div class="flex justify-center space-x-3">
                <button onclick="closeModal('expenseRecordModal')" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-full font-bold">閉じる</button>
                <button onclick="saveExpenseRecord()" class="px-6 py-2 bg-pink-500 text-white font-bold rounded-full shadow-md">決定</button>
            </div>
        </div>
    </div>

    <div id="accountModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-blue-600">口座の登録・編集</h2>
                <button onclick="closeModal('accountModal')" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <input type="hidden" id="ac-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">口座名・銀行名</label>
                    <input type="text" id="ac-name" placeholder="例: ゆうちょ銀行" class="w-full border border-gray-300 rounded p-2">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">実際の残高 (円)</label>
                    <input type="number" id="ac-balance" placeholder="例: 150000" class="w-full border border-gray-300 rounded p-2">
                    <p class="text-[10px] text-gray-500 mt-1">※銀行等で確認した時点の残高を入力してください</p>
                </div>
            </div>
            <div class="flex justify-between mt-6">
                <button id="ac-delete-btn" onclick="deleteAccount()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hidden">削除</button>
                <div class="flex space-x-3 ml-auto">
                    <button onclick="closeModal('accountModal')" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold">キャンセル</button>
                    <button onclick="saveAccount()" class="px-4 py-2 bg-blue-500 text-white font-bold rounded-lg shadow hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <div class="text-pink-500 mb-4 text-4xl"><i class="fa-solid fa-circle-exclamation"></i></div>
            <p id="confirmMessage" class="mb-6 text-gray-800 font-bold whitespace-pre-line leading-relaxed"></p>
            <div class="flex justify-center space-x-4">
                <button onclick="closeConfirm()" class="px-6 py-2 bg-gray-200 rounded-full text-gray-700 font-bold">キャンセル</button>
                <button id="confirmOkBtn" class="px-6 py-2 bg-pink-500 rounded-full text-white font-bold shadow-md">OK</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <p id="alertMessage" class="mb-6 text-gray-800 font-bold whitespace-pre-line"></p>
            <button onclick="closeAlert()" class="px-6 py-2 bg-pink-500 rounded-full text-white font-bold shadow-md w-full">確認</button>
        </div>
    </div>

    <script>
        // XSS対策（エスケープ処理）関数
        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>"'`=\/]/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;', '`': '&#x60;', '=': '&#x3D;'
            }[s]));
        };

        const defaultData = {
            settings: {
                job1: { 
                    name: "", 
                    dailyWage: "", 
                    overtimeHourlyWage: "", 
                    tax: "",
                    customWorkDays: [], // 特例の出勤日（配列）
                    hidden: true
                },
                job2: { 
                    name: "くろちゃん", 
                    hourlyWage: 1300,
                    timeStep: 15,
                    hidden: false
                }
            },
            settingsHistory: [],
            workRecords: {}, 
            accounts: [], 
            expenseItems: [], 
            expenseRecords: {} 
        };

        let appData = JSON.parse(localStorage.getItem('kintaiAppData')) || defaultData;
        if (!appData.accounts) appData.accounts = [];
        if (!appData.expenseItems) {
            appData.expenseItems = [];
            appData.expenseRecords = {};
        }
        // 古いデータ形式のマイグレーション
        if (!appData.settings.job1.customWorkDays) {
            appData.settings.job1.customWorkDays = [];
        }
        if (appData.settings.job1.hidden === undefined) appData.settings.job1.hidden = true;
        if (appData.settings.job2.hidden === undefined) appData.settings.job2.hidden = false;
        if (!appData.settings.job2.timeStep) appData.settings.job2.timeStep = 15;
        if (!appData.settingsHistory) appData.settingsHistory = [];

        // 旧サンプルデータがブラウザに残っている場合は新しい初期状態へ自動移行
        if (appData.settings.job1.name === "エノモト工業" || (!appData.settings.job1.name && appData.settings.job2.hourlyWage === 1000)) {
            appData.settings.job1 = {
                name: "",
                dailyWage: "",
                overtimeHourlyWage: "",
                tax: "",
                customWorkDays: [],
                hidden: true
            };
            appData.settings.job2.name = "くろちゃん";
            appData.settings.job2.hourlyWage = 1300;
            appData.settings.job2.timeStep = 15;
            appData.settings.job2.hidden = false;
            if (appData.settingsHistory.length > 0 && appData.settingsHistory[0].savedAt === "初期設定") {
                appData.settingsHistory[0].job1 = JSON.parse(JSON.stringify(appData.settings.job1));
                appData.settingsHistory[0].job2 = JSON.parse(JSON.stringify(appData.settings.job2));
            }
            saveData();
        }

        // 初期履歴が存在しない場合、現在設定を基準の初期履歴として登録（過去すべての月を保護）
        if (appData.settingsHistory.length === 0) {
            appData.settingsHistory.push({
                id: 1,
                effectiveFrom: "2000-01",
                savedAt: "初期設定",
                job1: JSON.parse(JSON.stringify(appData.settings.job1)),
                job2: JSON.parse(JSON.stringify(appData.settings.job2)),
                note: "基本設定の初期登録"
            });
        }
        appData.settingsHistory.forEach(h => {
            if (h.job2 && !h.job2.timeStep) h.job2.timeStep = 15;
        });

        let currentTab = 'home';
        let currentExpenseSubTab = 'list'; 
        let currentDate = new Date();
        let chartInstance = null;
        let expenseChartInstance = null;
        let currentChartType = 'month'; 
        let currentExpenseGraphType = 'month'; 
        let selectedGraphDetail = null;
        let holidaysData = {};

        async function fetchHolidays() {
            try {
                const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
                holidaysData = await res.json();
                if(currentTab === 'calendar') render();
            } catch (e) {
                console.log("祝日データの取得に失敗しました (オフライン計算を使用)");
            }
        }
        fetchHolidays();

        function getFallbackHoliday(year, month, day) {
            const fixedHolidays = {
                '1-1': '元日', '2-11': '建国記念の日', '2-23': '天皇誕生日',
                '4-29': '昭和の日', '5-3': '憲法記念日', '5-4': 'みどりの日', '5-5': 'こどもの日',
                '8-11': '山の日', '11-3': '文化の日', '11-23': '勤労感謝の日'
            };
            const key = `${month+1}-${day}`;
            let hName = fixedHolidays[key];

            const getNthMonday = (y, m, nth) => {
                let d = new Date(y, m, 1);
                let count = 0;
                while(d.getMonth() === m) {
                    if(d.getDay() === 1) {
                        count++;
                        if(count === nth) return d.getDate();
                    }
                    d.setDate(d.getDate() + 1);
                }
                return -1;
            };

            if(month === 0 && day === getNthMonday(year, 0, 2)) hName = '成人の日';
            if(month === 6 && day === getNthMonday(year, 6, 3)) hName = '海の日';
            if(month === 8 && day === getNthMonday(year, 8, 3)) hName = '敬老の日';
            if(month === 9 && day === getNthMonday(year, 9, 2)) hName = 'スポーツの日';

            if(month === 2) {
                const shunbun = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
                if(day === shunbun) hName = '春分の日';
            }
            if(month === 8) {
                const shubun = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
                if(day === shubun) hName = '秋分の日';
            }

            if(hName) return hName;

            let prevD = new Date(year, month, day - 1);
            if(prevD.getDay() === 0) {
                const prevHol = getFallbackHoliday(prevD.getFullYear(), prevD.getMonth(), prevD.getDate());
                if(prevHol && prevHol !== '振替休日') return '振替休日';
            }
            if(month === 4 && day === 6) {
                if(new Date(year, 4, 3).getDay()===0 || new Date(year, 4, 4).getDay()===0 || new Date(year, 4, 5).getDay()===0) return '振替休日';
            }
            if(month === 8) {
                const keiroDay = getNthMonday(year, 8, 3);
                const shubunDay = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
                if(shubunDay - keiroDay === 2 && day === keiroDay + 1) return '国民の休日';
            }
            return "";
        }

        function getHolidayName(year, month, day) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            if (holidaysData[dateStr]) return holidaysData[dateStr];
            return getFallbackHoliday(year, month, day);
        }

        function saveData() { localStorage.setItem('kintaiAppData', JSON.stringify(appData)); }

        function openModal(id) { 
            document.getElementById(id).classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden');
            document.body.style.overflow = ''; 
        }
        function showAlert(msg) { document.getElementById('alertMessage').innerText = msg; openModal('alertModal'); }
        function closeAlert() { closeModal('alertModal'); }
        
        let confirmCallback = null;
        function showConfirm(msg, callback) {
            document.getElementById('confirmMessage').innerText = msg;
            confirmCallback = callback;
            openModal('confirmModal');
        }
        function closeConfirm() { closeModal('confirmModal'); confirmCallback = null; }
        document.getElementById('confirmOkBtn').addEventListener('click', () => {
            if(confirmCallback) confirmCallback();
            closeConfirm();
        });

        function cleanupFutureData() {
            const today = new Date();
            const currentRealMonthStr = getMonthString(today);
            let dataModified = false;

            for (const mStr in appData.expenseRecords) {
                if (mStr > currentRealMonthStr) {
                    const recs = appData.expenseRecords[mStr];
                    appData.expenseItems.forEach(item => {
                        if (item.type === 'fixed' && recs[item.id]) {
                            if (!recs[item.id].isPaid && recs[item.id].amount !== '') {
                                recs[item.id].amount = '';
                                dataModified = true;
                            }
                        }
                    });
                }
            }
            if (dataModified) {
                saveData();
            }
        }

        function initializeMonthExpenses(targetDate) {
            const mStr = getMonthString(targetDate);
            if (!appData.expenseRecords[mStr]) appData.expenseRecords[mStr] = {};

            const today = new Date();
            const currentRealMonthStr = getMonthString(today);
            const isFutureMonth = mStr > currentRealMonthStr;

            appData.expenseItems.filter(i => !i.isDeleted).forEach(item => {
                let rec = appData.expenseRecords[mStr][item.id];

                if (!rec) {
                    let initialAmount = '';
                    if (!isFutureMonth && item.type === 'fixed' && item.defaultAmount > 0) {
                        initialAmount = item.defaultAmount;
                    }
                    appData.expenseRecords[mStr][item.id] = {
                        amount: initialAmount,
                        isPaid: false
                    };
                } else {
                    if (!isFutureMonth && item.type === 'fixed' && item.defaultAmount > 0) {
                        if (!rec.isPaid && (rec.amount === '' || rec.amount === 0)) {
                            rec.amount = item.defaultAmount;
                        }
                    }
                }
            });
        }

        function switchTab(tabId) {
            currentTab = tabId;
            currentDate = new Date(); 
            selectedGraphDetail = null; 
            updateHeaderMonth();
            initializeMonthExpenses(currentDate);

            ['home', 'calendar', 'expenses', 'settings'].forEach(id => {
                const el = document.getElementById(`tab-${id}`);
                if(id === tabId) el.classList.replace('tab-inactive', 'tab-active');
                else el.classList.replace('tab-active', 'tab-inactive');
            });
            window.scrollTo(0, 0);
            render();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            selectedGraphDetail = null;
            updateHeaderMonth();
            initializeMonthExpenses(currentDate);
            render();
        }

        function updateHeaderMonth() {
            const y = currentDate.getFullYear();
            const m = String(currentDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('headerMonth').innerText = `${y}/${m}`;
        }
        function getMonthString(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
        const fmt = (num) => Number(num || 0).toLocaleString();

        // 指定した月（YYYY-MM）に有効だった設定を取得する関数（過去設定の保護）
        function getSettingsForMonth(targetMonthStr) {
            if (!appData.settingsHistory || appData.settingsHistory.length === 0) {
                return appData.settings;
            }
            // effectiveFrom が targetMonthStr 以前の履歴の中で、最も新しい年月（および登録順）を適用
            const sorted = [...appData.settingsHistory].sort((a, b) => {
                if (a.effectiveFrom !== b.effectiveFrom) {
                    return b.effectiveFrom.localeCompare(a.effectiveFrom);
                }
                return (b.id || 0) - (a.id || 0);
            });
            const matched = sorted.find(h => h.effectiveFrom <= targetMonthStr);
            return matched || sorted[sorted.length - 1] || appData.settings;
        }

        function getPaydayDate(year, month) {
            let d = new Date(year, month, 25);
            while (true) {
                let dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6 || getHolidayName(d.getFullYear(), d.getMonth(), d.getDate())) {
                    d.setDate(d.getDate() - 1); 
                } else {
                    return d.getDate();
                }
            }
        }

        // 指定した刻み（15分, 30分, 1分）に丸めるヘルパー（HH:MM形式）
        function roundToStep(timeStr, step = 15) {
            if (!timeStr) return '';
            const [hStr, mStr] = timeStr.split(':');
            let h = parseInt(hStr, 10);
            let m = parseInt(mStr, 10);
            if (isNaN(h) || isNaN(m)) return timeStr;
            if (step <= 1) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            
            const roundedM = Math.round(m / step) * step;
            if (roundedM >= 60) {
                h = (h + 1) % 24;
                m = 0;
            } else {
                m = roundedM;
            }
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        // シフトの勤務時間・深夜時間（22:00〜翌5:00）を分単位で正確に計算
        function calcShiftDuration(startStr, endStr) {
            if (!startStr || !endStr) return { totalHours: 0, normalHours: 0, nightHours: 0, valid: false };
            const [sH, sM] = startStr.split(':').map(Number);
            const [eH, eM] = endStr.split(':').map(Number);
            if (isNaN(sH) || isNaN(sM) || isNaN(eH) || isNaN(eM)) return { totalHours: 0, normalHours: 0, nightHours: 0, valid: false };

            const startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;

            // 終了時刻が開始時刻以下の場合は翌日と解釈（例: 17:00〜01:00）
            if (endMin <= startMin) {
                endMin += 24 * 60;
            }

            let normalMin = 0;
            let nightMin = 0;

            // 1分ごとに深夜時間帯（22:00=1320分〜翌5:00=300分）を判定
            for (let t = startMin; t < endMin; t++) {
                const mod = t % 1440;
                if (mod >= 1320 || mod < 300) {
                    nightMin++;
                } else {
                    normalMin++;
                }
            }

            return {
                totalHours: (endMin - startMin) / 60,
                normalHours: normalMin / 60,
                nightHours: nightMin / 60,
                valid: true
            };
        }

        // 単一シフトの給料計算（通常時給 + 深夜は時給×1.25、四捨五入）
        function calcShiftSalary(shiftDur, hourlyWage) {
            if (!shiftDur || !shiftDur.valid) return 0;
            const normalPay = shiftDur.normalHours * hourlyWage;
            const nightPay = shiftDur.nightHours * (hourlyWage * 1.25);
            return Math.round(normalPay + nightPay);
        }

        function calculateSalary(targetDate) {
            const currentMonthStr = getMonthString(targetDate);
            const prevDate = new Date(targetDate.getFullYear(), targetDate.getMonth() - 1, 1);
            const prevMonthStr = getMonthString(prevDate);

            // 当月・前月に適用されていたそれぞれの設定を取得
            const currentSet = getSettingsForMonth(currentMonthStr);
            const prevSet = getSettingsForMonth(prevMonthStr);

            // 当月の「暦通りの所定労働日数」を計算
            let scheduledWorkDays = 0;
            const y = targetDate.getFullYear();
            const m = targetDate.getMonth();
            const lastDay = new Date(y, m + 1, 0).getDate();
            const customDays = currentSet.job1.customWorkDays || [];
            
            for (let i = 1; i <= lastDay; i++) {
                const dateStrForCheck = `${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const d = new Date(y, m, i);
                const dayOfWeek = d.getDay();
                const isHoliday = getHolidayName(y, m, i) !== "";

                if (customDays.includes(dateStrForCheck)) {
                    scheduledWorkDays++;
                } else if (!isHoliday && dayOfWeek >= 1 && dayOfWeek <= 5) {
                    scheduledWorkDays++;
                }
            }

            let job1PrevAbsent = 0, job1Overtime = 0, prevJob1Overtime = 0;
            let job2Hours = 0, job2NightHours = 0;
            let prevJob2Hours = 0, prevJob2NightHours = 0, prevJob2Salary = 0;
            let totalExtraIncome = 0;

            const prevHourlyWage = prevSet.job2.hourlyWage || currentSet.job2.hourlyWage || 0;

            for (const [dateStr, record] of Object.entries(appData.workRecords)) {
                const month = dateStr.substring(0, 7);
                
                // 当月のデータ集計
                if (month === currentMonthStr) {
                    if (record.job1 && record.job1.overtime) job1Overtime += parseFloat(record.job1.overtime);
                    if (record.job2) {
                        if (record.job2.shifts && Array.isArray(record.job2.shifts)) {
                            record.job2.shifts.forEach(shift => {
                                const dur = calcShiftDuration(shift.start, shift.end);
                                if (dur.valid) {
                                    job2Hours += dur.totalHours;
                                    job2NightHours += dur.nightHours;
                                }
                            });
                        } else if (record.job2.hours) {
                            job2Hours += parseFloat(record.job2.hours);
                        }
                    }
                    if (record.extraIncome && record.extraIncome.amount) totalExtraIncome += parseFloat(record.extraIncome.amount);
                }
                
                // 前月のデータ集計（翌月反映分）
                if (month === prevMonthStr) {
                    if (record.job1) {
                        if (record.job1.status === 'absent') job1PrevAbsent += 1;
                        if (record.job1.overtime) prevJob1Overtime += parseFloat(record.job1.overtime);
                    }
                    if (record.job2) {
                        if (record.job2.shifts && Array.isArray(record.job2.shifts)) {
                            record.job2.shifts.forEach(shift => {
                                const dur = calcShiftDuration(shift.start, shift.end);
                                if (dur.valid) {
                                    prevJob2Hours += dur.totalHours;
                                    prevJob2NightHours += dur.nightHours;
                                    prevJob2Salary += calcShiftSalary(dur, prevHourlyWage);
                                }
                            });
                        } else if (record.job2.hours) {
                            // 旧データ（シフト指定なし）の後方互換性
                            const h = parseFloat(record.job2.hours);
                            prevJob2Hours += h;
                            prevJob2Salary += Math.round(h * prevHourlyWage);
                        }
                    }
                }
            }

            // 仕事1の給料計算（前月設定・当月設定を考慮、未設定や空白は0として計算）
            let job1BaseDays = Math.max(0, scheduledWorkDays - job1PrevAbsent);
            const job1DailyRate = parseFloat(currentSet.job1.dailyWage) || 0;
            const job1BaseSalary = job1BaseDays * job1DailyRate;
            const job1OvertimeRate = parseFloat(prevSet.job1.overtimeHourlyWage) || parseFloat(currentSet.job1.overtimeHourlyWage) || 0;
            const job1OvertimePay = prevJob1Overtime * job1OvertimeRate;
            const job1Gross = job1BaseSalary + job1OvertimePay;
            const job1TaxRate = parseFloat(currentSet.job1.tax) || 0;
            
            let job1Net = 0;
            if (!currentSet.job1.hidden) {
                job1Net = job1Gross > 0 ? Math.max(0, job1Gross - job1TaxRate) : 0;
            }
            
            // 仕事2の給料計算（非表示設定を考慮）
            let job2FinalSalary = 0;
            if (!currentSet.job2.hidden) {
                job2FinalSalary = prevJob2Salary;
            }

            let expFixed = 0, expVar = 0, expCard = 0;
            const curRecs = appData.expenseRecords[currentMonthStr] || {};
            appData.expenseItems.forEach(item => {
                const r = curRecs[item.id];
                if(r && r.amount) {
                    if(item.type === 'fixed') expFixed += parseFloat(r.amount);
                    else if(item.type === 'variable') expVar += parseFloat(r.amount);
                    else if(item.type === 'card') expCard += parseFloat(r.amount);
                }
            });

            return {
                set: currentSet,
                job1: { 
                    hidden: !!currentSet.job1.hidden,
                    name: currentSet.job1.name || "仕事1",
                    scheduledWorkDays: scheduledWorkDays,
                    prevAbsent: job1PrevAbsent,
                    baseDays: job1BaseDays,
                    overtime: job1Overtime,
                    paidOvertime: prevJob1Overtime,
                    net: job1Net, 
                    tax: job1TaxRate 
                },
                job2: { 
                    hidden: !!currentSet.job2.hidden,
                    name: currentSet.job2.name || "仕事2",
                    hours: Math.round(job2Hours * 100) / 100,
                    nightHours: Math.round(job2NightHours * 100) / 100,
                    paidHours: Math.round(prevJob2Hours * 100) / 100,
                    paidNightHours: Math.round(prevJob2NightHours * 100) / 100,
                    salary: job2FinalSalary 
                },
                extraIncome: totalExtraIncome,
                expenses: { fixed: expFixed, variable: expVar, card: expCard, total: expFixed + expVar + expCard },
                totalIncome: (currentSet.job1.hidden ? 0 : job1Net) + (currentSet.job2.hidden ? 0 : job2FinalSalary) + totalExtraIncome
            };
        }

        function getBalancesForYear(targetYear) {
            const today = new Date();
            const curY = today.getFullYear();
            const curM = today.getMonth();
            const currentMonthStr = getMonthString(today);

            const currentTotalBalance = appData.accounts.reduce((sum, a) => sum + (parseFloat(a.balance)||0), 0);

            let pendingTotal = 0;
            let paidTotal = 0;
            const curRecs = appData.expenseRecords[currentMonthStr] || {};
            appData.expenseItems.forEach(item => {
                const r = curRecs[item.id];
                if(r && r.amount) {
                    if (!r.isPaid) pendingTotal += parseFloat(r.amount);
                    else paidTotal += parseFloat(r.amount);
                }
            });

            const baseBalance = currentTotalBalance - paidTotal - pendingTotal;
            function getMonthDiff(y, m) { return (y - curY) * 12 + (m - curM); }

            function calcBalanceAt(targetY, targetM) {
                let bal = baseBalance;
                const diff = getMonthDiff(targetY, targetM);

                if (diff === 0) return bal;

                if (diff > 0) {
                    let y = curY, m = curM + 1;
                    if(m > 11) { m = 0; y++; }
                    while (y < targetY || (y === targetY && m <= targetM)) {
                        const res = calculateSalary(new Date(y, m, 1));
                        bal += (res.totalIncome - res.expenses.total);
                        m++;
                        if(m > 11) { m = 0; y++; }
                    }
                } else {
                    let y = curY, m = curM;
                    while (y > targetY || (y === targetY && m > targetM)) {
                        const res = calculateSalary(new Date(y, m, 1));
                        bal -= (res.totalIncome - res.expenses.total);
                        m--;
                        if(m < 0) { m = 11; y--; }
                    }
                }
                return bal;
            }

            const incomeData = [];
            const expenseData = [];
            const balances = [];
            for(let m = 0; m < 12; m++) {
                const d = new Date(targetYear, m, 1);
                const mStr = getMonthString(d);
                const res = calculateSalary(d);
                
                incomeData.push(res.totalIncome);
                expenseData.push(res.expenses.total);
                
                const hasWork = Object.keys(appData.workRecords).some(k => k.startsWith(mStr));
                const hasExp = appData.expenseRecords[mStr] && Object.values(appData.expenseRecords[mStr]).some(r => parseFloat(r.amount) > 0);
                
                if (hasWork || hasExp) {
                    balances.push(calcBalanceAt(targetYear, m));
                } else {
                    balances.push(null);
                }
            }
            return { incomeData, expenseData, balances };
        }

            if (expenseChartInstance) { expenseChartInstance.destroy(); expenseChartInstance = null; }

                if(currentExpenseSubTab === 'graph') drawExpenseChart();
            }
            else if (currentTab === 'settings') appContent.innerHTML = renderSettings();
        }

                let badges = '';
                if (!targetSet.job1.hidden && rec.job1) {
                    if(rec.job1.status === 'work') badges += `<div class="text-[9px] bg-pink-100 text-pink-700 px-1 rounded mb-0.5 truncate">🏢出勤</div>`;
                    if(rec.job1.status === 'absent') badges += `<div class="text-[9px] bg-red-100 text-red-700 px-1 rounded mb-0.5 truncate">🏢欠勤</div>`;
                    if(rec.job1.overtime > 0) badges += `<div class="text-[9px] bg-purple-100 text-purple-700 px-1 rounded mb-0.5 truncate">残${rec.job1.overtime}h</div>`;
                }

                // 仕事2のバッジ表示（深夜労働がある場合は月アイコンを表示）
                if (!targetSet.job2.hidden && rec.job2) {
                    let totalH = 0;
                    let hasNight = false;

                    if (rec.job2.shifts && Array.isArray(rec.job2.shifts) && rec.job2.shifts.length > 0) {
                        rec.job2.shifts.forEach(s => {
                            const dur = calcShiftDuration(s.start, s.end);
                            if (dur.valid) {
                                totalH += dur.totalHours;
                                if (dur.nightHours > 0) hasNight = true;
                            }
                        });
                    } else if (rec.job2.hours > 0) {
                        totalH = parseFloat(rec.job2.hours);
                    }

                    if (totalH > 0) {
                        const nightBadge = hasNight ? `<i class="fa-solid fa-moon text-indigo-600 ml-0.5 text-[8px]" title="深夜料金適用"></i>` : '';
                        badges += `
                            <div class="text-[9px] bg-orange-100 text-orange-700 px-1 rounded mb-0.5 truncate flex items-center justify-between">
                                <span>🍳${Math.round(totalH * 10) / 10}h</span>
                                ${nightBadge}
                            </div>
                        `;
                    }
                }
                
                if (rec.extraIncome && rec.extraIncome.amount > 0) {
                    const memo = rec.extraIncome.memo ? `(${escapeHTML(rec.extraIncome.memo)})` : '';
                    badges += `<div class="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded mb-0.5 truncate">💰${fmt(rec.extraIncome.amount)}${memo}</div>`;
                }

                let isPaydayIcon = (i === payday) ? `<i class="fa-solid fa-coins text-yellow-500 absolute top-1 right-1 text-xs shadow-sm" title="給料日"></i>` : '';
                
                let dayColor = "text-gray-800";
                const dayOfWeek = new Date(y, m, i).getDay();
                if(dayOfWeek === 0) dayColor = "text-red-500";
                if(dayOfWeek === 6) dayColor = "text-blue-500";
                
                const hName = getHolidayName(y, m, i);
                let holidayNameHtml = "";
                if(hName) {
                    dayColor = "text-red-500";
                    holidayNameHtml = `<div class="text-[8px] text-red-500 font-bold truncate leading-tight">${escapeHTML(hName)}</div>`;
                }

                if(isCustomWorkDay) {
                    dayColor = "text-gray-800";
                }

                const isToday = (y === today.getFullYear() && m === today.getMonth() && i === today.getDate());
                const todayClass = isToday ? "ring-2 ring-pink-500 bg-pink-50 border-transparent z-10" : "border-b border-r border-gray-100 hover:bg-pink-50";

                html += `
                    <div onclick="openWorkModal('${dateStr}')" class="bg-white min-h-[80px] p-1 ${todayClass} cursor-pointer relative transition">
                        <div class="flex justify-between items-start">
                            <div class="text-xs font-bold ${dayColor}">${i}</div>
                            ${isPaydayIcon}
                        </div>
                        ${holidayNameHtml}
                        <div class="flex flex-col gap-0.5 mt-1">${badges}</div>
                    </div>
                `;
            }

            html += `</div></div><div class="mt-4 text-xs text-gray-500 text-center">日付をタップして勤怠入力</div>`;
            return html;
        }

        // 刻み（15分・30分・1分）に応じた時・分セレクトボックスのシフト行HTMLを生成
        function createShiftRowHtml(start = '', end = '', step = 15) {
            const stepNum = parseInt(step, 10) || 15;
            
            // 既存の時間が刻みと合わない場合は丸めて選択状態を決定
            const normalizedStart = roundToStep(start, stepNum);
            const normalizedEnd = roundToStep(end, stepNum);

            const [sH, sM] = normalizedStart ? normalizedStart.split(':') : ['', ''];
            const [eH, eM] = normalizedEnd ? normalizedEnd.split(':') : ['', ''];

            // 時オプション生成 (00 〜 23)
            let hourOptions = '<option value="">--</option>';
            for (let h = 0; h < 24; h++) {
                const hVal = String(h).padStart(2, '0');
                hourOptions += `<option value="${hVal}">${hVal}時</option>`;
            }

            // 分オプション生成（15分刻みなら 00, 15, 30, 45 のみ）
            let minuteOptions = '<option value="">--</option>';
            for (let m = 0; m < 60; m += stepNum) {
                const mVal = String(m).padStart(2, '0');
                minuteOptions += `<option value="${mVal}">${mVal}分</option>`;
            }

            // 選択属性を付与するヘルパー
            const applySelected = (optionsHtml, selectedVal) => {
                if (!selectedVal) return optionsHtml;
                return optionsHtml.replace(`value="${selectedVal}"`, `value="${selectedVal}" selected`);
            };

            return `
                <div class="shift-row flex items-center justify-between gap-1 bg-white p-2 rounded-lg border border-orange-200 shadow-sm text-sm">
                    <div class="flex-1 flex items-center justify-center gap-1">
                        <!-- 開始時刻 -->
                        <div class="flex items-center bg-gray-50 border border-gray-300 rounded px-1.5 py-1 shadow-inner">
                            <select class="shift-start-h bg-transparent font-bold text-gray-700 text-sm focus:outline-none" onchange="updateJob2ModalSummary()">
                                ${applySelected(hourOptions, sH)}
                            </select>
                            <span class="text-gray-400 font-bold px-0.5">:</span>
                            <select class="shift-start-m bg-transparent font-bold text-gray-700 text-sm focus:outline-none" onchange="updateJob2ModalSummary()">
                                ${applySelected(minuteOptions, sM)}
                            </select>
                        </div>

                        <span class="text-orange-400 font-bold text-xs px-1">〜</span>

                        <!-- 終了時刻 -->
                        <div class="flex items-center bg-gray-50 border border-gray-300 rounded px-1.5 py-1 shadow-inner">
                            <select class="shift-end-h bg-transparent font-bold text-gray-700 text-sm focus:outline-none" onchange="updateJob2ModalSummary()">
                                ${applySelected(hourOptions, eH)}
                            </select>
                            <span class="text-gray-400 font-bold px-0.5">:</span>
                            <select class="shift-end-m bg-transparent font-bold text-gray-700 text-sm focus:outline-none" onchange="updateJob2ModalSummary()">
                                ${applySelected(minuteOptions, eM)}
                            </select>
                        </div>
                    </div>
                    <button type="button" onclick="removeJob2ShiftRow(this)" class="text-red-400 hover:text-red-600 p-1.5 ml-1 transition" title="このシフトを削除">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            `;
        }

        function getActiveTimeStep() {
            const dStr = document.getElementById('modalDate').value;
            const targetSet = getSettingsForMonth(dStr ? dStr.substring(0, 7) : getMonthString(currentDate));
            return parseInt(targetSet.job2?.timeStep, 10) || 15;
        }

        function addJob2ShiftRow(start = '', end = '') {
            const container = document.getElementById('job2ShiftsList');
            const step = getActiveTimeStep();
            container.insertAdjacentHTML('beforeend', createShiftRowHtml(start, end, step));
            updateJob2ModalSummary();
        }

        function removeJob2ShiftRow(btn) {
            const row = btn.closest('.shift-row');
            if (row) row.remove();
            updateJob2ModalSummary();
        }

        function updateJob2ModalSummary() {
            const dStr = document.getElementById('modalDate').value;
            const targetSet = getSettingsForMonth(dStr.substring(0, 7));
            const hourlyWage = targetSet.job2.hourlyWage || 1000;

            const rows = document.querySelectorAll('#job2ShiftsList .shift-row');
            let totalH = 0;
            let normalH = 0;
            let nightH = 0;
            let count = 0;

            rows.forEach(row => {
                const sH = row.querySelector('.shift-start-h').value;
                const sM = row.querySelector('.shift-start-m').value;
                const eH = row.querySelector('.shift-end-h').value;
                const eM = row.querySelector('.shift-end-m').value;

                if (sH && sM && eH && eM) {
                    const dur = calcShiftDuration(`${sH}:${sM}`, `${eH}:${eM}`);
                    if (dur.valid) {
                        totalH += dur.totalHours;
                        normalH += dur.normalHours;
                        nightH += dur.nightHours;
                        count++;
                    }
                }
            });

            const summaryEl = document.getElementById('job2CalcSummary');
            if (count > 0 && totalH > 0) {
                const estSalary = calcShiftSalary({ normalHours: normalH, nightHours: nightH, valid: true }, hourlyWage);
                const nightBadge = nightH > 0 ? `<span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold ml-1"><i class="fa-solid fa-moon mr-1"></i>深夜 ${Math.round(nightH * 100) / 100}h (×1.25)</span>` : '';
                
                summaryEl.innerHTML = `
                    <div class="flex justify-between items-center font-bold">
                        <span>実働: ${Math.round(totalH * 100) / 100}時間 ${nightBadge}</span>
                        <span class="text-orange-700 text-sm">見込: ${fmt(estSalary)}円</span>
                    </div>
                `;
                summaryEl.classList.remove('hidden');
            } else {
                summaryEl.innerHTML = '';
                summaryEl.classList.add('hidden');
            }
        }

        function openWorkModal(dateStr) {
            document.getElementById('modalDate').value = dateStr;
            const d = new Date(dateStr);
            const mStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
            const targetSet = getSettingsForMonth(mStr);
            const step = parseInt(targetSet.job2?.timeStep, 10) || 15;

            document.getElementById('modalDateTitle').innerText = `${d.getMonth()+1}月${d.getDate()}日 (${['日','月','火','水','木','金','土'][d.getDay()]})`;
            document.getElementById('lbl-job1-name').innerText = targetSet.job1.name || "仕事1";
            document.getElementById('lbl-job2-name').innerText = targetSet.job2.name || "仕事2";

            // 刻み案内文の更新
            const noticeEl = document.getElementById('job2StepNotice');
            if (noticeEl) {
                noticeEl.innerText = `※時間は${step}分刻みです。17:00〜1:00など日をまたぐ場合は翌日として自動計算します。`;
            }

            // 仕事1と仕事2の表示・非表示切替（入力枠ごと完全に非表示）
            const job1Wrapper = document.getElementById('modalJob1Wrapper');
            const job2Wrapper = document.getElementById('modalJob2Wrapper');
            const bothNotice = document.getElementById('modalBothJobsHiddenNotice');

            if (targetSet.job1.hidden) {
                job1Wrapper.classList.add('hidden');
            } else {
                job1Wrapper.classList.remove('hidden');
            }

            if (targetSet.job2.hidden) {
                job2Wrapper.classList.add('hidden');
            } else {
                job2Wrapper.classList.remove('hidden');
            }

            if (targetSet.job1.hidden && targetSet.job2.hidden) {
                bothNotice.classList.remove('hidden');
            } else {
                bothNotice.classList.add('hidden');
            }

            const rec = appData.workRecords[dateStr] || {};
            let initStatus = rec.job1?.status || '';

            if (!rec.job1 && !rec.job2 && !rec.extraIncome) {
                const dayOfWeek = d.getDay();
                const isHoliday = getHolidayName(d.getFullYear(), d.getMonth(), d.getDate());
                const customDays = targetSet.job1.customWorkDays || [];
                const isCustomWorkDay = customDays.includes(dateStr);

                if (!targetSet.job1.hidden) {
                    if (isCustomWorkDay) {
                        initStatus = 'work';
                    } else if (!isHoliday && dayOfWeek >= 1 && dayOfWeek <= 5) {
                        initStatus = 'work';
                    }
                }
            }
            setJob1Status(initStatus);
            document.getElementById('modalJob1Overtime').value = rec.job1?.overtime || '';

            // 仕事2のシフト入力行の復元
            const shiftsContainer = document.getElementById('job2ShiftsList');
            shiftsContainer.innerHTML = '';
            if (rec.job2?.shifts && Array.isArray(rec.job2.shifts) && rec.job2.shifts.length > 0) {
                rec.job2.shifts.forEach(s => shiftsContainer.insertAdjacentHTML('beforeend', createShiftRowHtml(s.start, s.end, step)));
            } else {
                // デフォルトで1行用意
                shiftsContainer.insertAdjacentHTML('beforeend', createShiftRowHtml('', '', step));
            }
            updateJob2ModalSummary();
            
            const extraAmt = rec.extraIncome?.amount || '';
            document.getElementById('modalExtraAmount').value = extraAmt;
            document.getElementById('modalExtraMemo').value = rec.extraIncome?.memo || '';
            
            if (extraAmt) document.getElementById('extraIncomeFields').classList.remove('hidden');
            else document.getElementById('extraIncomeFields').classList.add('hidden');

            openModal('workModal');
        }

        function setJob1Status(status) {
            document.getElementById('modalJob1Status').value = status;
            ['none','work','absent'].forEach(id => document.getElementById(`btn-status-${id}`).className = "flex-1 py-2 rounded border border-gray-300 bg-white text-gray-500 text-sm");
            if(status === 'work') document.getElementById('btn-status-work').className = "flex-1 py-2 rounded border-2 border-pink-500 bg-pink-100 text-pink-700 font-bold text-sm shadow-inner";
            if(status === 'absent') document.getElementById('btn-status-absent').className = "flex-1 py-2 rounded border-2 border-red-500 bg-red-100 text-red-700 font-bold text-sm shadow-inner";
            if(!status) document.getElementById('btn-status-none').className = "flex-1 py-2 rounded border-2 border-gray-500 bg-gray-100 text-gray-800 font-bold text-sm shadow-inner";
        }

        function requestSaveWorkData() {
            const dateStr = document.getElementById('modalDate').value;
            const targetSet = getSettingsForMonth(dateStr ? dateStr.substring(0, 7) : getMonthString(currentDate));
            const ov = (!targetSet.job1.hidden) ? document.getElementById('modalJob1Overtime').value : 0;
            const parsedOv = ov ? parseFloat(ov) : 0;

            if (parsedOv > 0) {
                showConfirm("残業時間が入力されています。\n会社に報告しましたか？\n\n（「OK」で保存を完了します）", () => {
                    executeSaveWorkData();
                });
            } else {
                executeSaveWorkData();
            }
        }

        function executeSaveWorkData() {
            const dateStr = document.getElementById('modalDate').value;
            const targetSet = getSettingsForMonth(dateStr.substring(0, 7));
            const prevRec = appData.workRecords[dateStr] || {};

            const exAmt = document.getElementById('modalExtraAmount').value;
            const exMemo = document.getElementById('modalExtraMemo').value;

            // 仕事1のデータ決定（非表示なら既存データを保持、表示中ならフォームの値を取得）
            let job1Data = prevRec.job1 || null;
            if (!targetSet.job1.hidden) {
                const st = document.getElementById('modalJob1Status').value;
                const ov = document.getElementById('modalJob1Overtime').value;
                if (st || ov) {
                    job1Data = { status: st, overtime: ov ? parseFloat(ov) : 0 };
                } else {
                    job1Data = null;
                }
            }

            // 仕事2のデータ決定（非表示なら既存データを保持、表示中ならフォームの値を取得）
            let job2Data = prevRec.job2 || null;
            if (!targetSet.job2.hidden) {
                const shiftRows = document.querySelectorAll('#job2ShiftsList .shift-row');
                const validShifts = [];
                let totalJob2Hours = 0;
                let totalJob2NightHours = 0;

                shiftRows.forEach(row => {
                    const sH = row.querySelector('.shift-start-h').value;
                    const sM = row.querySelector('.shift-start-m').value;
                    const eH = row.querySelector('.shift-end-h').value;
                    const eM = row.querySelector('.shift-end-m').value;

                    if (sH && sM && eH && eM) {
                        const s = `${sH}:${sM}`;
                        const e = `${eH}:${eM}`;
                        const dur = calcShiftDuration(s, e);
                        if (dur.valid) {
                            validShifts.push({ start: s, end: e });
                            totalJob2Hours += dur.totalHours;
                            totalJob2NightHours += dur.nightHours;
                        }
                    }
                });

                if (validShifts.length > 0) {
                    job2Data = {
                        shifts: validShifts,
                        hours: Math.round(totalJob2Hours * 100) / 100,
                        nightHours: Math.round(totalJob2NightHours * 100) / 100
                    };
                } else {
                    job2Data = null;
                }
            }

            const extraIncomeData = (exAmt || exMemo) ? {
                amount: exAmt ? parseFloat(exAmt) : 0,
                memo: exMemo
            } : null;

            if (!job1Data && !job2Data && !extraIncomeData) {
                delete appData.workRecords[dateStr];
            } else {
                appData.workRecords[dateStr] = {};
                if (job1Data) appData.workRecords[dateStr].job1 = job1Data;
                if (job2Data) appData.workRecords[dateStr].job2 = job2Data;
                if (extraIncomeData) appData.workRecords[dateStr].extraIncome = extraIncomeData;
            }

            saveData(); 
            closeModal('workModal'); 
            render();
        }

                    <button onclick="currentExpenseSubTab='graph'; render();" class="flex-1 py-3 text-sm font-bold ${currentExpenseSubTab==='graph' ? 'bg-pink-50 text-pink-600 border-b-2 border-pink-500' : 'text-gray-500 hover:bg-gray-50'}">グラフ</button>

                                <div class="flex-1" onclick="openExpenseRecordModal(${item.id})" style="cursor:pointer;">
                                    <div class="font-bold ${item.isDeleted ? 'text-gray-400 line-through' : 'text-gray-800'} text-lg">${escapeHTML(item.name)}${item.isDeleted ? '<span class="text-xs ml-1 font-normal text-red-400">(削除済)</span>' : ''}</div>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-[10px] ${badgeClass} px-2 py-0.5 rounded">${typeName}</span>
                                        <span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded"><i class="fa-solid fa-building-columns mr-1"></i>${escapeHTML(accName)}</span>
                                    </div>
                                </div>
                                <button onclick="openExpenseItemModal(${item.id})" class="text-gray-400 hover:text-pink-500 px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                            </div>
                            <div class="flex justify-between items-end border-t border-dashed pt-2 mt-1">
                                <label class="flex items-center space-x-2 text-sm text-gray-600 cursor-pointer p-1">
                                    <input type="checkbox" onchange="togglePaid(${item.id}, this.checked)" class="w-4 h-4 text-pink-500 rounded focus:ring-pink-500" ${rec.isPaid ? 'checked' : ''}>
                                    <span>支払済</span>
                                </label>
                                <div onclick="openExpenseRecordModal(${item.id})" class="cursor-pointer font-bold text-xl ${rec.isPaid ? 'text-gray-500' : 'text-gray-800'}">
                                    ${rec.amount > 0 ? fmt(rec.amount) : '<span class="text-sm text-pink-400 font-normal">金額入力</span>'} <span class="text-xs text-gray-500">円</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            listHtml += `</div>`;
            return listHtml;
        }

        function renderGraphDetail() {
            if (!selectedGraphDetail) return '<div class="text-center text-sm text-gray-500 mt-6"><i class="fa-solid fa-hand-pointer text-gray-300 text-2xl mb-2 block"></i>グラフの要素をタップすると詳細が表示されます</div>';
            
            let html = '<div class="bg-white p-4 rounded-xl shadow border-t-4 border-pink-400 mt-4"><h4 class="font-bold text-gray-700 mb-3 border-b pb-2">';
            let listItems = [];

            if (selectedGraphDetail.type === 'year') {
                const m = selectedGraphDetail.index;
                const mStr = `${currentDate.getFullYear()}-${String(m + 1).padStart(2, '0')}`;
                html += `${m + 1}月の支払い詳細</h4>`;
                
                const curRecs = appData.expenseRecords[mStr] || {};
                appData.expenseItems.forEach(item => {
                    const rec = curRecs[item.id];
                    if (rec && rec.amount > 0) listItems.push({ item, rec, mStr });
                });
            } else if (selectedGraphDetail.type === 'month') {
                const types = ['fixed', 'variable', 'card'];
                const typeNames = ['固定費', '変動費', 'カード'];
                const typeColors = ['text-blue-600', 'text-amber-600', 'text-purple-600'];
                const t = types[selectedGraphDetail.index];
                const tName = typeNames[selectedGraphDetail.index];
                const mStr = getMonthString(currentDate);
                
                html += `<span class="${typeColors[selectedGraphDetail.index]}">${tName}</span> の詳細 (${currentDate.getMonth()+1}月)</h4>`;

                const curRecs = appData.expenseRecords[mStr] || {};
                appData.expenseItems.filter(i => i.type === t).forEach(item => {
                    const rec = curRecs[item.id];
                    if (rec && rec.amount > 0) listItems.push({ item, rec, mStr });
                });
            }

            if (listItems.length === 0) {
                html += '<p class="text-sm text-gray-500">登録がありません</p>';
            } else {
                html += '<div class="space-y-2">';
                listItems.forEach(d => {
                    html += `
                        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 cursor-pointer hover:bg-pink-50 transition" onclick="openExpenseRecordModal(${d.item.id}, '${d.mStr}')">
                            <div class="flex items-center space-x-2">
                                ${d.rec.isPaid ? '<span class="text-[10px] bg-pink-100 text-pink-600 px-1.5 py-0.5 rounded font-bold">済</span>' : ''}
                                <span class="font-bold ${d.item.isDeleted ? 'text-gray-400 line-through' : 'text-gray-800'}">${escapeHTML(d.item.name)}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="font-bold text-gray-700">${fmt(d.rec.amount)}円</span>
                                <i class="fa-solid fa-pen text-gray-300 text-sm"></i>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function showGraphDetail(type, index) {
            selectedGraphDetail = { type, index };
            const detailArea = document.getElementById('graph-detail-area');
            if (detailArea) detailArea.innerHTML = renderGraphDetail();
        }

        function renderExpenseGraphTab() {
            return `
                <div class="bg-white p-4 rounded-xl shadow mb-4 text-center">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 class="text-gray-700 font-bold">支出の分析</h3>
                        <select onchange="currentExpenseGraphType = this.value; selectedGraphDetail = null; render();" class="text-sm border border-gray-300 rounded p-1 bg-white">
                            <option value="month" ${currentExpenseGraphType === 'month' ? 'selected' : ''}>当月内訳 (円)</option>
                            <option value="year" ${currentExpenseGraphType === 'year' ? 'selected' : ''}>月毎支払 (棒)</option>
                        </select>
                    </div>
                    <div class="relative w-full h-64 mx-auto cursor-pointer">
                        <canvas id="expenseDetailChart"></canvas>
                    </div>
                </div>
                <!-- グラフ詳細表示エリア -->
                <div id="graph-detail-area">
                    ${renderGraphDetail()}
                </div>
            `;
        }

        function drawExpenseChart() {
            const ctx = document.getElementById('expenseDetailChart');
            if(!ctx) return;
            
            if (currentExpenseGraphType === 'month') {
                const s = calculateSalary(currentDate);
                const hasData = s.expenses.total > 0;
                expenseChartInstance = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['固定費', '変動費', 'カード'],
                        datasets: [{
                            data: hasData ? [s.expenses.fixed, s.expenses.variable, s.expenses.card] : [1,1,1],
                            backgroundColor: hasData ? ['#60a5fa', '#fbbf24', '#a78bfa'] : ['#e5e7eb','#e5e7eb','#e5e7eb'],
                            borderWidth: 2, borderColor: '#ffffff'
                        }]
                    },
                    options: { 
                        responsive: true, maintainAspectRatio: false,
                        onClick: (e, elements) => {
                            if (elements.length > 0 && hasData) showGraphDetail('month', elements[0].index);
                        },
                        plugins: { 
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        if(!hasData) return "データなし";
                                        return context.label + ': ' + fmt(context.raw) + '円';
                                    }
                                }
                            }
                        } 
                    }
                });
            } else {
                const y = currentDate.getFullYear();
                const { expenseData, balances } = getBalancesForYear(y);

                expenseChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                        datasets: [
                            { 
                                type: 'line', 
                                label: '引き落とし後残高', 
                                data: balances, 
                                borderColor: '#10b981', 
                                backgroundColor: '#10b981', 
                                borderWidth: 2, 
                                pointRadius: 4, 
                                tension: 0.1,
                                spanGaps: true
                            },
                            { 
                                type: 'bar', 
                                label: '支出合計', 
                                data: expenseData, 
                                backgroundColor: '#60a5fa' 
                            }
                        ]
                    },
                    options: { 
                        responsive: true, maintainAspectRatio: false,
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                showGraphDetail('year', elements[0].index);
                            }
                        }
                    }
                });
            }
        }

        function onExpenseTypeChange() {
            const t = document.getElementById('ei-type').value;
            document.getElementById('ei-name').placeholder = t === 'card' ? "例: 楽天カード (光熱費など)" : "例: 家賃、食費";
        }

        function openExpenseItemModal(id = null) {
            const accSelect = document.getElementById('ei-account');
            accSelect.innerHTML = '<option value="">指定なし</option>' + appData.accounts.map(a => `<option value="${a.id}">${escapeHTML(a.name)}</option>`).join('');

            if (id) {
                const item = appData.expenseItems.find(i => i.id === id);
                document.getElementById('ei-title').innerText = "支払い項目の編集";
                document.getElementById('ei-id').value = item.id;
                document.getElementById('ei-type').value = item.type;
                document.getElementById('ei-name').value = item.name;
                document.getElementById('ei-default-amount').value = item.defaultAmount || '';
                document.getElementById('ei-account').value = item.accountId || '';
                document.getElementById('ei-delete-btn').classList.remove('hidden');
            } else {
                document.getElementById('ei-title').innerText = "新しい支払い項目を追加";
                document.getElementById('ei-id').value = '';
                document.getElementById('ei-type').value = 'fixed';
                document.getElementById('ei-name').value = '';
                document.getElementById('ei-default-amount').value = '';
                document.getElementById('ei-account').value = '';
                document.getElementById('ei-delete-btn').classList.add('hidden');
            }
            onExpenseTypeChange();
            openModal('expenseItemModal');
        }

        function saveExpenseItem() {
            const id = document.getElementById('ei-id').value;
            const name = document.getElementById('ei-name').value;
            const defAmountStr = document.getElementById('ei-default-amount').value;
            if(!name) return showAlert("項目名を入力してください");

            const parsedDefAmount = defAmountStr ? parseFloat(defAmountStr) : 0;

            const data = {
                id: id ? parseInt(id) : Date.now(),
                type: document.getElementById('ei-type').value,
                name: name,
                defaultAmount: parsedDefAmount,
                accountId: document.getElementById('ei-account').value,
                isDeleted: false
            };

            if(id) {
                const idx = appData.expenseItems.findIndex(i => i.id == id);
                if(idx > -1) {
                    data.isDeleted = appData.expenseItems[idx].isDeleted; 
                    appData.expenseItems[idx] = data;
                }
            } else {
                appData.expenseItems.push(data);
            }

            const mStr = getMonthString(currentDate);
            if (!appData.expenseRecords[mStr]) appData.expenseRecords[mStr] = {};
            if (!appData.expenseRecords[mStr][data.id]) {
                appData.expenseRecords[mStr][data.id] = {
                    amount: '',
                    isPaid: false
                };
            }

            saveData(); 
            closeModal('expenseItemModal'); 
            initializeMonthExpenses(currentDate);
            render();
        }

        function deleteExpenseItem() {
            const id = parseInt(document.getElementById('ei-id').value);
            showConfirm("この項目を削除しますか？\n(過去の集計データは保持されます)", () => {
                const item = appData.expenseItems.find(i => i.id === id);
                if (item) item.isDeleted = true;
                saveData(); closeModal('expenseItemModal'); render();
            });
        }

        function openExpenseRecordModal(itemId, monthStr = null) {
            const targetMonthStr = monthStr || getMonthString(currentDate);
            const item = appData.expenseItems.find(i => i.id === itemId);
            const rec = (appData.expenseRecords[targetMonthStr] || {})[itemId] || { amount: '', isPaid: false };
            
            document.getElementById('er-name').innerText = item.name;
            const [y, m] = targetMonthStr.split('-');
            document.getElementById('er-month').innerText = `${y}年${parseInt(m)}月分`;
            
            document.getElementById('er-id').value = itemId;
            document.getElementById('er-target-month').value = targetMonthStr; 
            document.getElementById('er-amount').value = rec.amount || '';
            document.getElementById('er-ispaid').checked = rec.isPaid;
            
            openModal('expenseRecordModal');
        }

        function saveExpenseRecord() {
            const itemId = document.getElementById('er-id').value;
            const amount = document.getElementById('er-amount').value;
            const isPaid = document.getElementById('er-ispaid').checked;
            const mStr = document.getElementById('er-target-month').value;

            if(!appData.expenseRecords[mStr]) appData.expenseRecords[mStr] = {};
            appData.expenseRecords[mStr][itemId] = {
                amount: amount ? parseFloat(amount) : 0,
                isPaid: isPaid
            };
            
            if(selectedGraphDetail) {
                const detailArea = document.getElementById('graph-detail-area');
                if(detailArea) detailArea.innerHTML = renderGraphDetail();
            }

            saveData(); closeModal('expenseRecordModal'); render();
        }

        function togglePaid(itemId, isChecked) {
            const mStr = getMonthString(currentDate);
            if(!appData.expenseRecords[mStr]) appData.expenseRecords[mStr] = {};
            if(!appData.expenseRecords[mStr][itemId]) appData.expenseRecords[mStr][itemId] = { amount: 0 };
            appData.expenseRecords[mStr][itemId].isPaid = isChecked;
            saveData(); 
            
            const scrollPos = window.scrollY;
            render();
            window.scrollTo(0, scrollPos);
        }

        function addCustomWorkDayToDOM() {
            const dateInput = document.getElementById('newCustomWorkDay');
            const dateVal = dateInput.value;
            if (!dateVal) return;
            
            // 重複チェック
            const existing = Array.from(document.querySelectorAll('.custom-day-chip')).map(el => el.getAttribute('data-date'));
            if (existing.includes(dateVal)) {
                showAlert("既にリストに追加されています");
                return;
            }

            const [y, m, d] = dateVal.split('-');
            const chipHtml = `
                <span class="custom-day-chip bg-white border border-pink-300 text-pink-700 px-2 py-1 rounded-full text-xs flex items-center shadow-sm" data-date="${dateVal}">
                    ${y}/${m}/${d}
                    <button type="button" onclick="this.parentElement.remove()" class="ml-1 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                </span>
            `;
            document.getElementById('customWorkDaysList').insertAdjacentHTML('beforeend', chipHtml);
            dateInput.value = '';
        }

        function renderSettings() {
            const set = appData.settings;
            const now = new Date();
            const defaultEffectiveMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            
            let customDaysHtml = '';
            const customDays = set.job1.customWorkDays || [];
            customDays.forEach(dStr => {
                const [y, m, d] = dStr.split('-');
                customDaysHtml += `
                    <span class="custom-day-chip bg-white border border-pink-300 text-pink-700 px-2 py-1 rounded-full text-xs flex items-center shadow-sm" data-date="${dStr}">
                        ${y}/${m}/${d}
                        <button type="button" onclick="this.parentElement.remove()" class="ml-1 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                    </span>
                `;
            });

            // 設定履歴リストの生成（新しい順）
            const sortedHistories = [...appData.settingsHistory].sort((a, b) => {
                if (a.effectiveFrom !== b.effectiveFrom) return b.effectiveFrom.localeCompare(a.effectiveFrom);
                return (b.id || 0) - (a.id || 0);
            });

            let historyListHtml = '';
            if (sortedHistories.length === 0) {
                historyListHtml = '<p class="text-xs text-gray-400 text-center py-2">変更履歴はありません</p>';

                sortedHistories.forEach((h, idx) => {
                    const isBase = h.id === 1 || h.effectiveFrom === '2000-01';
                    historyListHtml += `
