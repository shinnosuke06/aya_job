                                <span class="text-pink-600"><i class="fa-solid fa-clock-rotate-left mr-1"></i>${isBase ? '基準設定 (全期間)' : `${h.effectiveFrom}〜 適用`}</span>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] text-gray-400 font-normal">${escapeHTML(h.savedAt)}</span>

                                </div>
                                <div>
                                    <span class="font-bold">仕事2:</span> ${h.job2?.hidden ? '<span class="text-red-500 font-bold">非表示</span>' : escapeHTML(h.job2?.name)}
                                    ${!h.job2?.hidden ? `<div class="text-[10px] text-gray-400">時給: ${fmt(h.job2?.hourlyWage)}円 / 刻み: ${h.job2?.timeStep || 15}分</div>` : ''}

                            ${h.note ? `<div class="text-[10px] text-gray-500 pt-0.5">メモ: ${escapeHTML(h.note)}</div>` : ''}

                        <label class="block font-bold text-pink-700 mb-1"><i class="fa-solid fa-calendar-check mr-1"></i> この設定を反映する開始月</label>
                        <p class="text-[11px] text-gray-600 mb-2">選択した月以降の計算にのみ反映されます。過去の月の設定・記録はそのまま保持されます。</p>

                    <div class="bg-white p-4 rounded-xl shadow border-t-4 border-pink-400">

                                <input type="checkbox" id="s_job1_hidden" ${set.job1.hidden ? 'checked' : ''} onchange="toggleJobSection('job1', this.checked)" class="w-4 h-4 text-pink-500 rounded">
                                <span class="text-xs font-bold text-pink-700">仕事を非表示にする</span>
                            </label>
                        </div>
                        
                        <div id="job1_fields" class="space-y-4 text-sm ${set.job1.hidden ? 'opacity-40 pointer-events-none' : ''}">
                            <div><label class="block text-gray-700 mb-1">勤め先名</label><input type="text" id="s_job1_name" value="${escapeHTML(set.job1.name || '')}" placeholder="例: 株式会社〇〇" class="w-full border rounded p-2"></div>
                            
                            <!-- 特定の出勤日の設定 -->
                            <div class="bg-pink-50 p-3 rounded-lg border border-pink-100">

                        </div>

                    </div>

                    <div>
                        <label class="block text-xs text-gray-500 mb-1">変更メモ (履歴用・任意)</label>
                        <input type="text" id="s_change_note" placeholder="例: 仕事2を退職、日給アップなど" class="w-full border border-gray-300 rounded p-2 text-sm bg-white mb-2">
                    </div>

                    <button onclick="saveSettings()" class="w-full py-3 bg-pink-500 text-white font-bold rounded-xl shadow-md hover:bg-pink-600 transition">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> この内容で保存して履歴に追加
                    </button>

                    <!-- 設定変更履歴アコーディオン -->
                    <div class="bg-white p-4 rounded-xl shadow border-t-4 border-purple-400 mt-6">
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <h3 class="font-bold text-gray-700"><i class="fa-solid fa-history mr-1 text-purple-500"></i> 設定の変更履歴</h3>
                            <span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">${sortedHistories.length}件</span>
                        </div>
                        <p class="text-[11px] text-gray-500 mb-3">各年月時点で有効だった給与条件や表示・非表示の履歴です。</p>
                        <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
                            ${historyListHtml}
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-xl shadow border-t-4 border-gray-400 mt-6">
                        <h3 class="font-bold text-gray-700 mb-2 border-b pb-2"><i class="fa-solid fa-file-export mr-1"></i> データの保存と管理</h3>
                        <div class="text-xs text-gray-500 mb-4 bg-gray-50 p-2 rounded">
                            <i class="fa-solid fa-circle-check text-green-500 mr-1"></i> 祝日・振替休日: オンラインから自動取得済
                        </div>
                        <p class="text-xs text-gray-500 mb-3">端末を変える時などにファイルとして保存・読み込みができます。</p>
                        <div class="flex gap-2">
                            <button onclick="exportData()" class="flex-1 py-2 bg-gray-100 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-200">
                                <i class="fa-solid fa-download mr-1"></i> 保存(出力)
                            </button>
                            <label class="flex-1 py-2 bg-gray-100 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-200 text-center cursor-pointer">
                                <i class="fa-solid fa-upload mr-1"></i> 読込(入力)
                                <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importData(event)">
                            </label>
                        </div>
                        <button onclick="resetToInitialDefaults()" class="w-full mt-4 py-2 text-xs text-red-500 hover:text-red-700 bg-red-50/50 hover:bg-red-50 rounded-lg border border-red-200 transition">
                            <i class="fa-solid fa-rotate-left mr-1"></i> アプリを初期状態（仕事1非表示／仕事2時給1300円）に初期化
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleJobSection(jobKey, isHidden) {
            const el = document.getElementById(`${jobKey}_fields`);
            if (el) {
                if (isHidden) {
                    el.classList.add('opacity-40', 'pointer-events-none');
                } else {
                    el.classList.remove('opacity-40', 'pointer-events-none');
                }
            }
        }

        function saveSettings() {
            const effectiveFrom = document.getElementById('s_effective_from').value;
            if (!effectiveFrom) return showAlert("反映する開始年月を指定してください");

            const job1Hidden = document.getElementById('s_job1_hidden').checked;
            const job2Hidden = document.getElementById('s_job2_hidden').checked;
            const changeNote = document.getElementById('s_change_note').value.trim();

            const chips = document.querySelectorAll('.custom-day-chip');
            const customDays = Array.from(chips).map(chip => chip.getAttribute('data-date')).sort();

            const dailyVal = document.getElementById('s_job1_daily').value;
            const otVal = document.getElementById('s_job1_overtime').value;
            const taxVal = document.getElementById('s_job1_tax').value;
            const hVal = document.getElementById('s_job2_hourly').value;

            const newJob1 = {
                name: document.getElementById('s_job1_name').value.trim(),
                dailyWage: dailyVal !== '' ? parseFloat(dailyVal) : '',
                overtimeHourlyWage: otVal !== '' ? parseFloat(otVal) : '',
                tax: taxVal !== '' ? parseFloat(taxVal) : '',
                customWorkDays: customDays,
                hidden: job1Hidden
            };

            const newJob2 = {
                name: document.getElementById('s_job2_name').value.trim() || "仕事2",
                hourlyWage: hVal !== '' ? parseFloat(hVal) : '',
                timeStep: parseInt(document.getElementById('s_job2_timestep').value, 10) || 15,
                hidden: job2Hidden
            };

            // 最新の設定を更新
            appData.settings.job1 = JSON.parse(JSON.stringify(newJob1));
            appData.settings.job2 = JSON.parse(JSON.stringify(newJob2));

            // 保存日時
            const d = new Date();
            const savedAt = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

            // 同じ effectiveFrom の履歴があれば上書き、なければ新規追加
            const existingIdx = appData.settingsHistory.findIndex(h => h.effectiveFrom === effectiveFrom && h.id !== 1);
            const historyItem = {
                id: existingIdx > -1 ? appData.settingsHistory[existingIdx].id : Date.now(),
                effectiveFrom: effectiveFrom,
                savedAt: savedAt,
                job1: newJob1,
                job2: newJob2,
                note: changeNote || (existingIdx > -1 ? "設定の更新" : "設定の新規保存")
            };

            if (existingIdx > -1) {
                appData.settingsHistory[existingIdx] = historyItem;
            } else {
                appData.settingsHistory.push(historyItem);
            }

            saveData(); 
            showAlert(`${effectiveFrom} 以降の設定として保存し、履歴に記録しました！`);
            render();
        }

        function resetToInitialDefaults() {
            showConfirm("アプリを初期状態にリセットしますか？\n（仕事1: 非表示・各項目空白\n仕事2: くろちゃん・時給1300円・15分刻み）", () => {
                localStorage.removeItem('kintaiAppData');
                appData = JSON.parse(JSON.stringify(defaultData));
                cleanupFutureData();
                initializeMonthExpenses(currentDate);
                saveData();
                render();
                showAlert("初期状態にリセットしました！");
            });
        }

        function deleteSettingsHistory(id) {
            showConfirm("この履歴を削除しますか？\n（削除すると、その期間はひとつ前の履歴設定で計算されます）", () => {
                appData.settingsHistory = appData.settingsHistory.filter(h => h.id !== id);
                saveData();
                render();
            });
        }

        function openAccountModal(id = null) {
            if (id) {
                const acc = appData.accounts.find(a => a.id === id);
                document.getElementById('ac-id').value = acc.id;
                document.getElementById('ac-name').value = acc.name;
                document.getElementById('ac-balance').value = acc.balance;
                document.getElementById('ac-delete-btn').classList.remove('hidden');
            } else {
                document.getElementById('ac-id').value = '';
                document.getElementById('ac-name').value = '';
                document.getElementById('ac-balance').value = '';
                document.getElementById('ac-delete-btn').classList.add('hidden');
            }
            openModal('accountModal');
        }

        function saveAccount() {
            const id = document.getElementById('ac-id').value;
            const name = document.getElementById('ac-name').value;
            const balance = document.getElementById('ac-balance').value;
            if(!name) return showAlert("口座名を入力してください");

            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const data = {
                id: id ? parseInt(id) : Date.now(),
                name: name,
                balance: parseFloat(balance) || 0,
                lastUpdated: dateStr
            };

            if (id) {
                const idx = appData.accounts.findIndex(a => a.id == id);
                if(idx > -1) appData.accounts[idx] = data;
            } else {
                appData.accounts.push(data);
            }
            saveData(); closeModal('accountModal'); render();
        }

        function deleteAccount() {
            const id = parseInt(document.getElementById('ac-id').value);
            showConfirm("この口座を削除しますか？", () => {
                appData.accounts = appData.accounts.filter(a => a.id !== id);
                appData.expenseItems.forEach(item => { if(item.accountId == id) item.accountId = ''; });
                saveData(); closeModal('accountModal'); render();
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dlNode = document.createElement('a');
            dlNode.setAttribute("href", dataStr);
            dlNode.setAttribute("download", "kintai_data.json");
            document.body.appendChild(dlNode);
            dlNode.click();
            dlNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            showConfirm("現在のデータは上書きされます。よろしいですか？", () => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if(importedData && importedData.settings && importedData.workRecords) {
                            appData = importedData;
                            
                            // 過去バージョンデータの安全補完（マイグレーション）
                            if (!appData.accounts) appData.accounts = [];
                            if (!appData.expenseItems) appData.expenseItems = [];
                            if (!appData.expenseRecords) appData.expenseRecords = {};

                            appData.expenseItems.forEach(item => {
                                if (item.isDeleted === undefined) item.isDeleted = false;
                            });

                            if (!appData.settings.job1) appData.settings.job1 = {};
                            if (!appData.settings.job2) appData.settings.job2 = {};

                            if (!appData.settings.job1.customWorkDays) appData.settings.job1.customWorkDays = [];
                            if (appData.settings.job1.hidden === undefined) appData.settings.job1.hidden = false;
                            if (appData.settings.job2.hidden === undefined) appData.settings.job2.hidden = false;
                            if (!appData.settings.job2.timeStep) appData.settings.job2.timeStep = 15;

                            // 過去データに履歴がない場合、読み込んだ設定を基準設定として履歴化
                            if (!appData.settingsHistory || appData.settingsHistory.length === 0) {
                                appData.settingsHistory = [{
                                    id: 1,
                                    effectiveFrom: "2000-01",
                                    savedAt: "読込データ基準設定",
                                    job1: JSON.parse(JSON.stringify(appData.settings.job1)),
                                    job2: JSON.parse(JSON.stringify(appData.settings.job2)),
                                    note: "以前の保存データからの復元"
                                }];
                            }

                            cleanupFutureData(); 
                            saveData();
                            render();
                            showAlert("データを安全に読み込み、現在の仕様に合わせて復元しました！");
                        } else {
                            showAlert("ファイルの形式が正しくありません。");
                        }
                    } catch (error) {
                        showAlert("ファイルの読み込みに失敗しました。");
                    }
                };
                reader.readAsText(file);
            });
            event.target.value = '';
        }

        cleanupFutureData();
        initializeMonthExpenses(currentDate);
        updateHeaderMonth();
        render();

    </script>
</body>
</html>
